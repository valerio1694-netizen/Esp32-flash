name: Eufy Android APK
on:
  push:
    branches:
      - feature/eufy-wroom-ota
    paths:
      - "android/**"
      - ".github/workflows/eufy-android.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platforms using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Check generated APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Package versioned APK
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(grep -m1 'versionName ' android/app/build.gradle | cut -d"'" -f2)"
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Android versionName"; exit 1; }
          echo "EUFY_APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Eufy-15C-Monitor-v${APP_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Eufy-Android-v${{ env.EUFY_APP_VERSION }}
          path: android/app/build/outputs/apk/debug/Eufy-15C-Monitor-v*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish public APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk Eufy-15C-Monitor.apk
          TAG="eufy-android-v${EUFY_APP_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version $EUFY_APP_VERSION already released. Increment versionName and versionCode." >&2
            exit 1
          fi
          gh release create "$TAG" "android/app/build/outputs/apk/debug/Eufy-15C-Monitor-v${EUFY_APP_VERSION}.apk" \
            --target "$GITHUB_SHA" --title "Eufy 15C Android v${EUFY_APP_VERSION}" \
            --notes "Debug APK; ungetestete Diagnose-App. ESP32 und GD32 bleiben unveraendert, bis ein OTA-Upload explizit gestartet wird." \
            --prerelease
          if ! gh release view eufy-15c-monitor-preview >/dev/null 2>&1; then
            gh release create eufy-15c-monitor-preview \
              --target "$GITHUB_SHA" --title "Eufy 15C Monitor – Vorschau" \
              --notes "Ungetestete Debug-APK. Zeigt die ESP32-SWD-Telemetrie an und erlaubt ESP32-OTA; keine GD32-Schreibbefehle." \
              --prerelease
          fi
          gh release upload eufy-15c-monitor-preview Eufy-15C-Monitor.apk --clobber
