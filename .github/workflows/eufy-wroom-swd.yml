name: Eufy ESP32-WROOM CMSIS-DAP TCP
on:
  push:
    branches:
      - feature/eufy-wroom-cmsis-dap
      - feature/eufy-wroom-ota
    paths:
      - ".github/workflows/eufy-wroom-swd.yml"
      - "eufy-wroom/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-wroom:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install ESP-IDF 6.0.2
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v6.0.2"
      - name: Retrieve CMSIS-DAP TCP firmware
        run: |
          git clone --depth 1 https://github.com/bkuschak/cmsis_dap_tcp_esp32.git upstream
          git -C upstream fetch --depth 1 origin f615f35b1a242ebfba160cb61fdd3d1b9de54497
          git -C upstream checkout --detach f615f35b1a242ebfba160cb61fdd3d1b9de54497
          git -C upstream rev-parse HEAD | tee upstream-commit.txt
      - name: Integrate read-only SWD live telemetry
        shell: bash
        run: |
          set -euo pipefail
          cp eufy-wroom/eufy_monitor.c eufy-wroom/eufy_monitor.h eufy-wroom/eufy_ota.c eufy-wroom/eufy_ota.h eufy-wroom/eufy_network.c eufy-wroom/eufy_network.h upstream/main/
          cp eufy-wroom/partitions_ota.csv upstream/partitions_eufy.csv
          python eufy-wroom/patch_upstream.py upstream
          grep -n eufy_monitor upstream/main/{main.c,cmsis_dap_tcp.c,CMakeLists.txt}
      - name: Generate WROOM config and unique WLAN password
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          FW_VERSION="$(tr -d '\r\n' < eufy-wroom/VERSION)"
          [[ "$FW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid firmware VERSION"; exit 1; }
          echo "EUFY_FW_VERSION=$FW_VERSION" >> "$GITHUB_ENV"
          AP_PASSWORD="$(openssl rand -hex 16)"
          printf 'SSID=Eufy-SWD-WROOM\nPASSWORD=%s\nIP=192.168.4.1\nCMSIS_DAP_TCP_PORT=4441\n' "$AP_PASSWORD" > dist/wifi-credentials.txt
          cat > upstream/sdkconfig.board_eufy_wroom <<EOF
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
          CONFIG_ESPTOOLPY_FLASHSIZE="4MB"
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions_eufy.csv"
          CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
          CONFIG_ESP_CONSOLE_UART_DEFAULT=y
          CONFIG_ESP_DAP_1_SWD_SUPPORTED=y
          CONFIG_ESP_DAP_1_JTAG_SUPPORTED=n
          CONFIG_ESP_DAP_1_NRESET_SUPPORTED=n
          CONFIG_ESP_DAP_1_GPIO_SWCLK_TCK=18
          CONFIG_ESP_DAP_1_GPIO_SWDIO_TMS=19
          CONFIG_ESP_DAP_1_LED_NONE=y
          CONFIG_ESP_DAP_1_TCP_PORT=4441
          CONFIG_ESP_DAP_PRODUCT_ID="Eufy RoboVac SWD ESP32-WROOM"
          CONFIG_ESP_DAP_IO_PORT_WRITE_CYCLES=16
          CONFIG_ESP_DAP_DELAY_SLOW_CYCLES=7
          CONFIG_ESP_UART_BRIDGE_1_ENABLED=y
          CONFIG_ESP_UART_BRIDGE_1_TCP_PORT=4442
          CONFIG_ESP_UART_BRIDGE_1_UART_NUM=1
          CONFIG_ESP_UART_BRIDGE_1_REMAP_PINS=y
          CONFIG_ESP_UART_BRIDGE_1_TXD_PIN=17
          CONFIG_ESP_UART_BRIDGE_1_RXD_PIN=16
          CONFIG_ESP_UART_BRIDGE_1_BAUD_RATE=115200
          CONFIG_ESP_DAP_MANAGE_WIFI=y
          CONFIG_ESP_DAP_WIFI_MODE_AP=y
          CONFIG_ESP_DAP_SOFTAP_SSID="Eufy-SWD-WROOM"
          CONFIG_ESP_DAP_SOFTAP_PASSWORD="$AP_PASSWORD"
          CONFIG_COMPILER_OPTIMIZATION_PERF=y
          EOF
          # Explicitly select the classic ESP32 preset, not the repo's first S3 preset.
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("upstream/CMakePresets.json")
          j = json.loads(p.read_text())
          j["configurePresets"].insert(0, {
              "name": "board_eufy_wroom",
              "displayName": "Eufy ESP32-WROOM-32",
              "binaryDir": "build/build_eufy_wroom",
              "cacheVariables": {
                  "IDF_TARGET": "esp32",
                  "SDKCONFIG": "build/build_eufy_wroom/sdkconfig",
                  "SDKCONFIG_DEFAULTS": "sdkconfig.board_eufy_wroom"
              }
          })
          p.write_text(json.dumps(j, indent=2) + "\n")
          PY
      - name: Configure and compile for original ESP32
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          export IDF_PRESET=board_eufy_wroom
          idf.py set-target esp32
          idf.py build
          grep -E 'CONFIG_IDF_TARGET=|CONFIG_ESP_DAP_1_GPIO_SWCLK_TCK=|CONFIG_ESP_DAP_1_GPIO_SWDIO_TMS=|CONFIG_ESP_UART_BRIDGE_1_TXD_PIN=|CONFIG_ESP_UART_BRIDGE_1_RXD_PIN=|CONFIG_ESP_DAP_WIFI_MODE_AP=' build/build_eufy_wroom/sdkconfig
          python - <<'PY'
          from pathlib import Path
          s = Path("build/build_eufy_wroom/sdkconfig").read_text()
          expected = [
              'CONFIG_IDF_TARGET="esp32"',
              'CONFIG_ESP_DAP_1_GPIO_SWCLK_TCK=18',
              'CONFIG_ESP_DAP_1_GPIO_SWDIO_TMS=19',
              'CONFIG_ESP_UART_BRIDGE_1_TXD_PIN=17',
              'CONFIG_ESP_UART_BRIDGE_1_RXD_PIN=16',
              'CONFIG_ESP_DAP_WIFI_MODE_AP=y'
          ]
          missing = [line for line in expected if line not in s.splitlines()]
          if missing: raise SystemExit(f"Incorrect ESP32-WROOM configuration: {missing}")
          print("Verified target=esp32, SWD 18/19, UART 17/16, AP mode")
          PY
      - name: Package single-file flash image and component images
        shell: bash
        run: |
          set -euo pipefail
          cp upstream/build/build_eufy_wroom/bootloader/bootloader.bin dist/bootloader.bin
          cp upstream/build/build_eufy_wroom/partition_table/partition-table.bin dist/partition-table.bin
          cp upstream/build/build_eufy_wroom/cmsis_dap_tcp_esp32.bin dist/firmware.bin
          cp dist/firmware.bin dist/Eufy-WROOM-OTA-app-only.bin
          cp dist/firmware.bin "dist/Eufy-WROOM-FW-v${EUFY_FW_VERSION}-OTA-app-only.bin"
          printf '%s\n' "$EUFY_FW_VERSION" > dist/FIRMWARE-VERSION.txt
          cp eufy-wroom/partitions_ota.csv dist/partitions_ota.csv
          cp eufy-wroom/VERSION dist/source-firmware-version.txt
          python -m esptool --chip esp32 merge-bin \
            --flash-mode dio --flash-freq 40m --flash-size 4MB \
            -o dist/Eufy-WROOM-OTA-full.bin \
            0x1000 upstream/build/build_eufy_wroom/bootloader/bootloader.bin \
            0x8000 upstream/build/build_eufy_wroom/partition_table/partition-table.bin \
            0x10000 upstream/build/build_eufy_wroom/cmsis_dap_tcp_esp32.bin
          cp "dist/Eufy-WROOM-OTA-full.bin" "dist/Eufy-WROOM-FW-v${EUFY_FW_VERSION}-full.bin"
          cp eufy-wroom/Flash-COM10-OTA.ps1 dist/Flash-COM10-OTA.ps1
          cp upstream-commit.txt dist/upstream-commit.txt
          mkdir -p dist/source
          cp eufy-wroom/*.c eufy-wroom/*.h eufy-wroom/*.py dist/source/
          cp eufy-wroom/partitions_ota.csv dist/source/
          cp eufy-wroom/README-OTA.md dist/source/
          cp eufy-wroom/VERSION dist/source/
          cp .github/workflows/eufy-wroom-swd.yml dist/source/
          printf 'FIRMWARE_COMMIT=%s\nUPSTREAM_REF=%s\n' "$GITHUB_SHA" "$(cat upstream-commit.txt)" > dist/source/build-versions.txt
          python - <<'PY'
          from pathlib import Path
          bin = Path('dist/firmware.bin')
          assert bin.stat().st_size < 0x160000, "OTA app exceeds slot"
          cfg = Path("upstream/build/build_eufy_wroom/sdkconfig").read_text()
          assert 'CONFIG_PARTITION_TABLE_CUSTOM=y' in cfg
          assert 'CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y' in cfg
          assert 'CONFIG_IDF_TARGET="esp32"' in cfg
          print("OTA slot / rollback settings validated",bin.stat().st_size)
          PY
          sha256sum dist/*.bin > dist/SHA256SUMS
          test -s dist/Eufy-WROOM-OTA-full.bin
      - uses: actions/upload-artifact@v4
        with:
          name: Eufy-WROOM-FW-v${{ env.EUFY_FW_VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
